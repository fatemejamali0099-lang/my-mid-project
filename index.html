<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISION</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Top Orange Bar -->
    <div class="top-bar">
        تا ۷۰٪ تخفیف برای لوازم جانبی اورجینال آیفون
    </div>

    <header class="header">
        <div class="right">
            <img src="./assests/images/App Store.png" class="">
            <h2 class="logo">اپل استور</h2>
        </div>

        <div class="center">
            <div class="search-box">
                <button class="products-btn"> ☰ محصولات</button>
                <input type="text" placeholder="جستجو کنید">
            </div>
        </div>

        <div class="left">
            <img src="./assests/images/Link.png" class="icon">
            <img src="./assests/images/Link (1).png" class="icon">
        </div>
    </header>

    <!-- libraries Icons -->

    <section class="libraries">
        <div class="library">
            <img src="./assests/images/MagSafe Power Adapter.png">
            <p>شارژر مگ سیف</p>
        </div>
        <div class="library">
            <img src="./assests/images/HomePod mini.png">
            <p>هوم پاد</p>
        </div>
        <div class="library">
            <img src="./assests/images/Apple TV HD.png">
            <p>اپل تیوی</p>
        </div>
        <div class="library">
            <img src="./assests/images/Apple Watch 7 Front.png">
            <p>اپل واچ</p>
        </div>
        <div class="library point">
            <img src="./assests/images/AirPods Pro.png">
            <p>ایرپاد</p>
        </div>
        <div class="library">
            <img src="./assests/images/iPad Pro Back.png">
            <p>آیپد</p>
        </div>
        <div class="library">
            <img src="./assests/images/iPhone 13 Pro Back.png">
            <p>آیفون</p>
        </div>
    </section>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <div class="logo">

                <h1> Vision Pro</h1>
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M21.9689 6.34117C23.1956 4.85778 24.0656 2.83746 24.0656 0.791663C24.0676 0.525161 24.0421 0.260623 23.9892 0C21.9943 0.0764233 19.5899 1.32859 18.1594 3.01774C17.0346 4.29538 15.9863 6.34118 15.9863 8.38893C15.9882 8.62996 16.0137 8.86902 16.0627 9.10417C16.2391 9.13748 16.4193 9.15512 16.5996 9.15512C18.3887 9.15512 20.6383 7.9539 21.9689 6.34117ZM23.3739 9.59015C20.3816 9.59015 17.9517 11.4047 16.3919 11.4047C14.7302 11.4047 12.557 9.69204 9.94684 9.69204C5.01261 9.69204 0 13.7836 0 21.4808C0 26.2877 1.84201 31.3512 4.14256 34.6256C6.11194 37.3867 7.82461 39.6637 10.3054 39.6637C12.7608 39.6637 13.8346 38.0275 16.8779 38.0275C19.9721 38.0275 20.6618 39.6127 23.3739 39.6127C26.0585 39.6127 27.8496 37.1574 29.5368 34.7275C31.4297 31.941 32.2214 29.229 32.2469 29.1016C32.094 29.0507 26.954 26.9539 26.954 21.0732C26.954 15.9842 30.9947 13.7092 31.224 13.5308C28.5648 9.69204 24.4987 9.59015 23.3739 9.59015ZM48.8602 39.3815H55.1759L68.3208"

                </svg>
            </div>
            <p class="vision-txt">اولین نفری باشید که ویژن پرو می خرید</p>
            <button class="buy-btn">خرید کنید</button>
            <div class="hero-image">
                <img src="./assests/images/visionright.png">
                <img src="./assests/images/vision.png" width="1130px">
                <img src="./assests/images/visionleft.png">
            </div>
            <div class="circles">
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class=" circle Orange-circle"></div>
            </div>
    </section>

    <!-- Offer Section -->
    <section class="offer">
        <div class="timer">
            <div class="time-box">
                <span>1</span>
                <small class="under">روز</small>
            </div>

            <div class="time-box">
                <span>24</span>
                <small class="under">ساعت</small>
            </div>

            <div class="time-box">
                <span>15</span>
                <small class="under">دقیقه</small>
            </div>

            <div class="time-box">
                <span>10</span>
                <small class="under">ثانیه</small>
            </div>

                    <h3 class="offer-sub">پیشنهاد شگفت انگیز</h3>

        </div>





    </section>

</body>

</html>
